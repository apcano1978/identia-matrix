# Lo mínimo para que un error de validación se pueda leer.
#
# Sin esto, `ActiveRecord::RecordInvalid` se anuncia como
# «Translation missing: es.activerecord.errors.messages.record_invalid» y el
# mensaje real —el que dice qué falló— desaparece del log y de la suite.
#
# NO es el catálogo de la interfaz: eso es F3, y probablemente con la gema
# `rails-i18n`. Esto solo cubre lo que el modelo necesita para explicarse.
es:
  # El separador de miles. Sin esto `number_with_delimiter(3412)` devuelve
  # «3,412», que en español es tres coma cuatro uno dos — el número equivocado,
  # no solo la puntuación equivocada.
  number:
    format:
      delimiter: "."
      separator: ","

  errors:
    format: "%{attribute} %{message}"
    messages:
      blank: "no puede estar en blanco"
      taken: "ya está en uso"
      invalid: "no es válido"
      inclusion: "no está incluido en la lista"
      not_a_number: "no es un número"
      greater_than_or_equal_to: "debe ser mayor o igual que %{count}"
      in: "debe estar entre %{count}"
  activerecord:
    errors:
      messages:
        record_invalid: "La validación falló: %{errors}"
        restrict_dependent_destroy:
          has_many: "No se puede eliminar: hay %{record} que dependen de esto"
          has_one: "No se puede eliminar: hay un %{record} que depende de esto"
  support:
    array:
      words_connector: ", "
      two_words_connector: " y "
      last_word_connector: " y "
  date:
    # `12 abr`. Es la forma que usa la maqueta en cuanto una espera pasa de una
    # semana: «47d» no le dice nada a nadie, una fecha sí.
    formats:
      short: "%-d %b"
      default: "%-d %b %Y"
    abbr_month_names:
      - ~
      - ene
      - feb
      - mar
      - abr
      - may
      - jun
      - jul
      - ago
      - sep
      - oct
      - nov
      - dic
