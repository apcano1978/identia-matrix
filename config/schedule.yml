# Tareas periódicas (sidekiq-cron). Cargado en config/initializers/sidekiq.rb.
#
# En F0 no hay ninguna. Las que llegarán:
#   · sincronización de la proyección de platform (F8)
#   · reconciliación de checksums del bucket de artefactos (F5)
#
# Convención heredada de identia-platform: el cron es un "heartbeat" a
# frecuencia fija que consulta la BD para decidir qué toca hacer. La frecuencia
# real de cada cosa se configura en la aplicación, no en este fichero.

# Un hash vacío, y no un fichero solo de comentarios: `sidekiq-cron` lee este
# fichero por su cuenta al arrancar el worker —con su propio hook, no con el
# initializer— y un YAML que parsea a `nil` lo hace levantar «Not supported
# schedule format». El worker muere antes de coger un solo job.
